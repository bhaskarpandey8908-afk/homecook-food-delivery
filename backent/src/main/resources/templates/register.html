<!DOCTYPE html>
<html>

<head>

    <title>Register - HomeChef</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffffff, #f3f4f6 55%, #e5e7eb);
            color: #111827;
            font-family: Arial, sans-serif;
        }

        .container {
            padding-top: 32px;
            padding-bottom: 32px;
        }

        .register-card {
            background: linear-gradient(180deg, #ffffff, #f8fafc);
            border: 1px solid #d1d5db;
            border-radius: 26px;
            box-shadow: 0 28px 60px rgba(15, 23, 42, 0.16);
            overflow: hidden;
            position: relative;
        }

        .register-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(59, 130, 246, 0.08), transparent 60%);
            pointer-events: none;
        }

        .register-header {
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            color: #111827;
            border-bottom: 1px solid #fed7aa;
            text-align: center;
            padding: 1.7rem 1rem 1.5rem;
            position: relative;
            z-index: 1;
        }

        .register-header h2 {
            margin: 0;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        .card-body {
            padding: 2rem 1.8rem 1.5rem;
            position: relative;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            color: #111827 !important;
            font-size: 0.92rem;
            margin-bottom: 0.5rem;
        }

        .form-control,
        .form-select {
            height: 48px;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #111827;
            padding-left: 14px;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 0 1px rgba(17, 24, 39, 0.02);
        }

        .form-control::placeholder {
            color: #4b5563;
            opacity: 1;
        }

        .form-control:focus,
        .form-select:focus {
            box-shadow: 0 0 0 0.2rem rgba(251, 191, 36, 0.14);
            border-color: #fbbf24;
            background: #fff;
            color: #111827;
        }

        .form-select option {
            background: #fff;
            color: #111827;
        }

        .btn-warning {
            border-radius: 14px;
            height: 50px;
            font-weight: 800;
            background: linear-gradient(135deg, #f59e0b, #f97316, #fb7185);
            border: none;
            transition: 0.2s ease, transform 0.2s ease;
            box-shadow: 0 12px 25px rgba(249, 115, 22, 0.3);
            color: #111827;
        }

        .btn-warning:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 16px 28px rgba(249, 115, 22, 0.4);
        }

        .bottom-text {
            color: #374151 !important;
        }

        .login-link {
            color: #b45309;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6 col-sm-10">

            <div class="register-card shadow-lg">

                <div class="register-header">
                    <h2>Create Account</h2>
                </div>

                <div class="card-body">

                    <form
                        method="post"
                        action="/register">

                        <div class="form-group">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input
                                class="form-control"
                                name="name"
                                placeholder="Enter your full name"
                                required>
                        </div>

                        <div class="form-group">
                            <label class="form-label fw-semibold">Email</label>
                            <input
                                class="form-control"
                                type="email"
                                name="email"
                                placeholder="Enter your email"
                                required>
                        </div>

                        <div class="form-group">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input
                                class="form-control"
                                name="phone"
                                placeholder="Enter your phone number"
                                required>
                        </div>

                        <div class="form-group">
                            <label class="form-label fw-semibold">Password</label>
                            <input
                                class="form-control"
                                type="password"
                                name="password"
                                placeholder="Create a password"
                                required>
                        </div>

                        <div class="form-group">
                            <label class="form-label fw-semibold">Address</label>
                            <input
                                class="form-control"
                                name="address"
                                placeholder="Enter your address">
                        </div>

                        <div class="form-group mb-4">
                            <label class="form-label fw-semibold">Role</label>
                            <select class="form-select" name="role">
                                <option value="CUSTOMER">Customer</option>
                                <option value="OWNER">Owner</option>
                                <option value="CHEF">Home Chef</option>
                            </select>
                        </div>

                        <button class="btn btn-warning w-100 mb-3">
                            Create Account
                        </button>

                    </form>

                    <p class="text-center mt-2 mb-0 bottom-text">
                        Already have an account?
                        <a href="/login" class="login-link">
                            Login
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role');
    if (role) {
        const select = document.querySelector('select[name="role"]');
        if (select) {
            select.value = role.toUpperCase();
        }
    }
</script>

</body>
</html>
