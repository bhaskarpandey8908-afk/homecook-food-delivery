<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0b1020 0%, #111827 35%, #1b1b2f 100%);
            color: #f8fafc;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.92) !important;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .card {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(17, 24, 39, 0.9));
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 22px;
            box-shadow: 0 22px 38px rgba(15, 23, 42, 0.32);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(59, 130, 246, 0.08), transparent 60%);
            pointer-events: none;
        }
    </style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            🛠 HomeChef Admin
        </span>

    </div>

</nav>

<div class="container py-5">

    <h1 class="mb-4">
        Admin Dashboard
    </h1>

    <div class="row">

        <div class="col-md-3">

            <div class="card shadow p-4 text-center">

                <h2 th:text="${users}">
                    0
                </h2>

                <p>Users</p>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow p-4 text-center">

                <h2 th:text="${chefs}">
                    0
                </h2>

                <p>Chefs</p>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow p-4 text-center">

                <h2 th:text="${meals}">
                    0
                </h2>

                <p>Meals</p>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow p-4 text-center">

                <h2 th:text="${orders}">
                    0
                </h2>

                <p>Orders</p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
