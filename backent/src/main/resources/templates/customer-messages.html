<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Messages - HomeChef</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: linear-gradient(140deg, #eef2f7, #dbe4ef); color: #172033; font-family: Arial, sans-serif; }
        .wrap { max-width: 900px; margin: 40px auto; padding: 0 16px; }
        .message-card { background: #fff; border: 1px solid #dce3ed; border-radius: 18px; padding: 22px; margin-bottom: 16px; box-shadow: 0 12px 28px rgba(25, 42, 70, .08); }
        .message-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: #526075; font-size: .9rem; }
        .message-body { margin: 16px 0 0; white-space: pre-wrap; font-size: 1.05rem; }
        .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 22px; }
        .top h1 { font-weight: 800; }
    </style>
</head>
<body>
<main class="wrap">
    <div class="top">
        <h1 class="h2 mb-0">Messages about your orders</h1>
        <a href="/meals" class="btn btn-warning">Back to meals</a>
    </div>
    <div class="message-card" th:each="message : ${messages}">
        <div class="message-head">
            <strong th:text="|Order #HC-${#numbers.formatInteger(message.order.id, 6)}|">Order number</strong>
            <span th:text="${message.formattedCreatedAt}">Date and time</span>
        </div>
        <p class="message-body" th:text="${message.message}">Order update</p>
    </div>
    <div class="message-card text-center text-secondary" th:if="${#lists.isEmpty(messages)}">
        You don't have any order messages yet.
    </div>
</main>
</body>
</html>
