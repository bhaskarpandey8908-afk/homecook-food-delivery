<!DOCTYPE html>
<html>

<head>

    <title>Chef Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0b1020 0%, #111827 35%, #1b1b2f 100%);
            color: #f8fafc;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.92) !important;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .card {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(17, 24, 39, 0.9));
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 22px;
            box-shadow: 0 22px 38px rgba(15, 23, 42, 0.32);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(59, 130, 246, 0.08), transparent 60%);
            pointer-events: none;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.5);
            color: #f8fafc;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            border: none;
            font-weight: 700;
            color: #111827;
        }
    </style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            👨‍🍳 Chef Dashboard
        </span>

        <a href="/"
           class="btn btn-warning">
            Home
        </a>

    </div>

</nav>

<div class="container py-5">

    <h2>
        Add Today's Meal
    </h2>

    <form
        method="post"
        action="/chef/meal/add"
        class="card p-4 shadow">

        <input
            name="chefId"
            class="form-control mb-3"
            placeholder="Chef ID"
            required>

        <input
            name="name"
            class="form-control mb-3"
            placeholder="Meal Name"
            required>

        <textarea
            name="description"
            class="form-control mb-3"
            placeholder="Description">
        </textarea>

        <input
            type="number"
            step="0.01"
            name="price"
            class="form-control mb-3"
            placeholder="Price"
            required>

        <input
            name="category"
            class="form-control mb-3"
            placeholder="Category">

        <select name="mealTime" class="form-control mb-3" required>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch" selected>Lunch</option>
            <option value="Dinner">Dinner</option>
        </select>

        <select name="foodType" class="form-control mb-3" required>
            <option value="VEG" selected>Vegetarian</option>
            <option value="NON_VEG">Non-vegetarian</option>
        </select>

        <input
            name="image"
            class="form-control mb-3"
            placeholder="Image URL">

        <input
            type="number"
            name="quantity"
            class="form-control mb-3"
            placeholder="Available Quantity">

        <button
            class="btn btn-warning">

            Upload Meal

        </button>

    </form>

</div>

</body>
</html>
