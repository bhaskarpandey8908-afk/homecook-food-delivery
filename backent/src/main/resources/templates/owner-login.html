<!DOCTYPE html>
<html>
<head>
    <title>Owner Login - HomeChef</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffffff, #f3f4f6 55%, #e5e7eb);
            color: #111827;
            font-family: Arial, sans-serif;
        }

        .login-card {
            background: linear-gradient(180deg, #ffffff, #f8fafc);
            border: 1px solid #d1d5db;
            border-radius: 24px;
            box-shadow: 0 28px 60px rgba(15, 23, 42, 0.16);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
        }

        .login-header {
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            padding: 1.5rem 1.2rem;
            text-align: center;
            color: #111827;
            border-bottom: 1px solid #fed7aa;
        }

        .login-header h2 {
            margin: 0;
            font-weight: 800;
        }

        .card-body {
            padding: 2rem 1.8rem 1.6rem;
        }

        .form-label {
            color: #111827;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-control {
            height: 48px;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #111827;
        }

        .form-control::placeholder {
            color: #4b5563;
            opacity: 1;
        }

        .form-control:focus {
            border-color: #f59e0b;
            background: #fff;
            color: #111827;
            box-shadow: 0 0 0 0.2rem rgba(245, 158, 11, 0.16);
        }

        .form-control::placeholder {
            color: #cbd5e1;
        }

        .btn-warning {
            border-radius: 14px;
            width: 100%;
            min-height: 52px;
            height: 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            border: none;
            color: #111827;
            text-transform: uppercase;
            font-size: 0.82rem;
            line-height: 1;
            padding: 0 20px;
        }

        .btn-outline-light {
            border-radius: 14px;
            width: 100%;
            min-height: 48px;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            font-size: 0.78rem;
            line-height: 1;
            padding: 0 20px;
            background: #fff;
            border: 1px solid #cbd5e1;
            color: #111827;
        }

        .text-link {
            color: #b45309;
            font-weight: 700;
            text-decoration: none;
        }

        .status-box {
            border-radius: 12px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-sm-10">
            <div class="login-card shadow-lg">
                <div class="login-header">
                    <h2>Owner Login</h2>
                </div>
                <div class="card-body">
                    <div th:if="${error}" class="status-box alert alert-danger mb-3" th:text="${error}"></div>

                    <form method="post" action="/owner-login">
                        <div class="mb-3">
                            <label class="form-label">Owner Email</label>
                            <input type="email" name="email" class="form-control" placeholder="Enter owner email" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>

                        <button class="btn btn-warning w-100 mb-3">Owner Login</button>
                        <a href="/register?role=OWNER" class="btn btn-outline-light w-100 mb-3">Create Owner Account</a>
                        <a href="/login" class="btn btn-outline-light w-100">Customer Login</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
